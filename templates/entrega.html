<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Dados de entrega</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <h1>Casa dos Cupcakes</h1>

        <nav>
            <a href="{{ url_for('inicio') }}">Início</a>
            <a href="{{ url_for('inicio') }}#cupcakes">Cupcakes</a>
            <a href="{{ url_for('pedidos') }}">Carrinho ({{ quantidade_carrinho }})</a>
            <a href="{{ url_for('contato') }}">Contato</a>

            {% if usuario_nome %}
                <span>Olá, {{ usuario_nome }}</span>
                <a href="{{ url_for('logout') }}">Sair</a>
            {% else %}
                <a href="{{ url_for('login') }}">Entrar</a>
                <a href="{{ url_for('cadastro') }}">Criar conta</a>
            {% endif %}
        </nav>
    </header>

    <main class="pagina-formulario">

        <section class="formulario-card">

            <h1>Dados de entrega</h1>

            <p>Informe onde deseja receber o seu pedido.</p>

            <form method="POST">

                <label for="nome">Nome do destinatário</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >

                <label for="cep">CEP</label>
                <input
                    type="text"
                    id="cep"
                    name="cep"
                    required
                >

                <label for="rua">Rua</label>
                <input
                    type="text"
                    id="rua"
                    name="rua"
                    required
                >

                <label for="numero">Número</label>
                <input
                    type="text"
                    id="numero"
                    name="numero"
                    required
                >

                <label for="bairro">Bairro</label>
                <input
                    type="text"
                    id="bairro"
                    name="bairro"
                    required
                >

                <label for="cidade">Cidade</label>
                <input
                    type="text"
                    id="cidade"
                    name="cidade"
                    required
                >

                <label for="complemento">Complemento</label>
                <input
                    type="text"
                    id="complemento"
                    name="complemento"
                >

                <button type="submit" class="botao">
                    Ir para pagamento
                </button>

            </form>

        </section>

    </main>

</body>
</html>
