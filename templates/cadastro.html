<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <h1>Casa dos Cupcakes</h1>

        <nav>
            <a href="{{ url_for('inicio') }}">Início</a>
            <a href="{{ url_for('inicio') }}#cupcakes">Cupcakes</a>
            <a href="{{ url_for('pedidos') }}">Carrinho ({{ quantidade_carrinho }})</a>
            <a href="{{ url_for('contato') }}">Contato</a>

            {% if usuario_nome %}
                <span>Olá, {{ usuario_nome }}</span>
                <a href="{{ url_for('logout') }}">Sair</a>
            {% else %}
                <a href="{{ url_for('login') }}">Entrar</a>
                <a href="{{ url_for('cadastro') }}">Criar conta</a>
            {% endif %}
        </nav>
    </header>

    <main class="pagina-formulario">

        <div class="formulario-card">

            <h1>Criar conta</h1>

            <p>Cadastre-se para acessar a Casa dos Cupcakes.</p>

            {% if erro %}
                <p class="mensagem-erro">{{ erro }}</p>
            {% endif %}

            <form method="POST">

                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    required
                >

                <button type="submit" class="botao">
                    Cadastrar
                </button>

            </form>

        </div>

    </main>

</body>

</html>
