<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Pagamento</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <h1>Casa dos Cupcakes</h1>

        <nav>
            <a href="{{ url_for('inicio') }}">Início</a>
            <a href="{{ url_for('inicio') }}#cupcakes">Cupcakes</a>
            <a href="{{ url_for('pedidos') }}">Carrinho ({{ quantidade_carrinho }})</a>
            <a href="{{ url_for('contato') }}">Contato</a>

            {% if usuario_nome %}
                <span>Olá, {{ usuario_nome }}</span>
                <a href="{{ url_for('logout') }}">Sair</a>
            {% else %}
                <a href="{{ url_for('login') }}">Entrar</a>
                <a href="{{ url_for('cadastro') }}">Criar conta</a>
            {% endif %}
        </nav>
    </header>

    <main class="pagina-formulario">

        <section class="formulario-card">

            <h1>Forma de pagamento</h1>

            <p>Escolha como deseja realizar o pagamento.</p>

            <a href="{{ url_for('pagamento_pix') }}" class="botao">
                Pagar com PIX
            </a>

            <a href="{{ url_for('pagamento_cartao') }}" class="botao">
                Pagar com cartão
            </a>

        </section>

    </main>

</body>
</html>
